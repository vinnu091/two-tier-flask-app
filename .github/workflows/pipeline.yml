name: ci/cd

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: install and lint
        run: |
          pip install -r requirements.txt
          pip install pylint
          pylint app.py

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root      # ✅ required by mysql:5.7
          MYSQL_DATABASE: devops
          MYSQL_USER: admin              # ✅ MYSQL_USER not MYSQL_USERNAME
          MYSQL_PASSWORD: admin
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -u admin -padmin"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: install and test
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential
          pip install -r requirements.txt
      - name: run tests
        env: |
          MYSQL_HOST: 127.0.0.1    # ✅ use 127.0.0.1 not "mysql" in GH Actions
          MYSQL_USER: admin
          MYSQL_PASSWORD: admin
          MYSQL_DB: devops
        run: pytest

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: build and push
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/two-tier-app:latest .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/two-tier-app:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/two-tier-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/two-tier-app:${{ github.sha }}

  notify-success:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: success()
    steps:
      - name: Notify success
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "✅ *two-tier-app project pipeline passed!*",
              "attachments": [{
                "color": "good",
                "fields": [
                  { "title": "Branch", "value": "${{ github.ref_name }}", "short": true },
                  { "title": "By", "value": "${{ github.actor }}", "short": true },
                  { "title": "Commit", "value": "${{ github.sha }}", "short": true }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  notify-failure:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: failure()
    steps:
      - name: Notify failure
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "❌ *two-tier-app project pipeline failed!*",
              "attachments": [{
                "color": "danger",
                "fields": [
                  { "title": "Branch", "value": "${{ github.ref_name }}", "short": true },
                  { "title": "By", "value": "${{ github.actor }}", "short": true },
                  { "title": "Logs", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

